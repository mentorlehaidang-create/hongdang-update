      <path d="M10,42 L10,10 L60,10" fill="none" stroke="var(--gold-bright)" stroke-width="3"/>
      <path d="M810,42 L810,10 L760,10" fill="none" stroke="var(--gold-bright)" stroke-width="3"/>
      <path d="M10,268 L10,300 L60,300" fill="none" stroke="var(--gold-bright)" stroke-width="3"/>
      <path d="M810,268 L810,300 L760,300" fill="none" stroke="var(--gold-bright)" stroke-width="3"/>
    </svg>`;
  }

  function setPluginSkin(skinId) {
    const p = SKIN_PRESETS.find(s => s.id === skinId) || SKIN_PRESETS[0];
    activeSkinId = p.id;
    currentSkinConfig = p;
    document.body.removeAttribute("data-theme");
    const vp = document.getElementById("viewport");
    if (vp) vp.setAttribute("data-skin", p.id);
    const crestEl = document.getElementById("akCostumeCrest");
    if (crestEl) crestEl.innerHTML = buildCenterCostumeSvg(p.id);
    const armorEl = document.getElementById("akStageArmor");
    if (armorEl) armorEl.innerHTML = buildStageArmorSvg(p.id);
    applyCustomColors(p.accent, p.accent2, p.sub, p.bg1, p.bg2);
    if (p.creature === "none" && dctx) {
      dctx.clearRect(0, 0, 820, 310);
    }
    renderSkinPopover();
    try { localStorage.setItem("hd_studio_skin_v4", JSON.stringify({ type: "preset", id: p.id })); } catch (_) {}
  }

  window.__setSkinPreset = setPluginSkin;

  function renderSkinPopover() {
    const pop = document.getElementById("skinPopover");
    if (!pop) return;

    const originSkin = SKIN_PRESETS[0];
    const otherSkins = SKIN_PRESETS.slice(1);
    const itemsHtml = otherSkins.map(s => `
      <button class="skin-item-btn ${activeSkinId === s.id ? 'active' : ''}" onclick="window.__setSkinPreset('${s.id}')">
        <span class="skin-dot" style="background: linear-gradient(135deg, ${s.accent}, ${s.sub});"></span>
        <span>${s.name}</span>
      </button>
    `).join("");

    pop.innerHTML = `
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;">
        <span style="font-size:11px;font-weight:800;color:#fff;">👗 CHỌN TRANG PHỤC (SKIN) CHO PLUGIN</span>
        <button onclick="document.getElementById('skinPopover').classList.remove('open')" style="background:none;border:none;color:#94a3b8;cursor:pointer;font-size:13px;font-weight:900;">✕</button>
      </div>
      <button class="skin-item-btn ${activeSkinId === 'origin' ? 'active' : ''}" style="width:100%;margin-bottom:5px;justify-content:center;padding:6px;" onclick="window.__setSkinPreset('origin')">
        <span class="skin-dot" style="background:#00e5ff;"></span>
        <span>${originSkin.name}</span>
      </button>
      <div class="skin-grid">${itemsHtml}</div>
    `;
  }

  const btnSkinMenu = document.getElementById("btnSkinMenu");
  const skinPopover = document.getElementById("skinPopover");
  if (btnSkinMenu && skinPopover) {
    skinPopover.addEventListener("click", e => e.stopPropagation());
    btnSkinMenu.addEventListener("click", e => {
      e.stopPropagation();
      const wasOpen = skinPopover.classList.contains("open");
      if (!wasOpen) {
        renderSkinPopover();
        skinPopover.classList.add("open");
      } else {
        skinPopover.classList.remove("open");
      }
    });
    window.addEventListener("click", () => skinPopover.classList.remove("open"));
    try {
      const saved = JSON.parse(localStorage.getItem("hd_studio_skin_v4") || "null");
      if (saved && saved.type === "preset") setPluginSkin(saved.id);
    } catch (_) {}
  }

  // Drag Window on Windows Desktop by dragging Header Bar
  document.getElementById("headerDragBar").addEventListener("mousedown", e => {
    if (e.target.closest("button") || e.target.closest("select") || e.target.id === "zoomPctLabel") return;
    emitToHost("startWindowDrag", {});
  });

  // Bottom-Right Corner Drag Resize
  (function initCornerResize() {
    const grip = document.getElementById("resizeGrip");
    let resizing = false;
    let startScreenX = 0;
    let startWidth = 820;

    grip.addEventListener("pointerdown", e => {
      resizing = true;
      startScreenX = e.screenX;
      startWidth = window.innerWidth || 820;
      grip.setPointerCapture(e.pointerId);
      e.stopPropagation();
    });
    grip.addEventListener("pointermove", e => {
      if (!resizing) return;
      const dx = e.screenX - startScreenX;
      const targetW = Math.max(540, Math.min(1500, startWidth + dx));
      currentScalePct = Math.round((targetW / 820) * 100);
      document.getElementById("zoomPctLabel").textContent = `${currentScalePct}%`;
      emitToHost("resizeWindow", { width: Math.round(targetW), height: Math.round(targetW * (580 / 820)) });
    });
    grip.addEventListener("pointerup", e => {
      resizing = false;
      try { grip.releasePointerCapture(e.pointerId); } catch (_) {}
    });
  })();

  function fitViewport() {
    const vp = document.getElementById("viewport");
    const sx = window.innerWidth / 820;
    const sy = window.innerHeight / 580;
    const scale = Math.min(sx, sy);
    vp.style.transform = `scale(${scale})`;
    currentScalePct = Math.round(scale * 100);
    const lbl = document.getElementById("zoomPctLabel");
    if (lbl) lbl.textContent = `${currentScalePct}%`;
  }
  window.addEventListener("resize", fitViewport);
  fitViewport();
  renderAll();

  let lastSeenCloudSeq = -1;
  const cloudModal = document.getElementById("cloudUpdateModal");
  const cloudModalTitle = document.getElementById("cloudModalTitle");
  const cloudModalDetail = document.getElementById("cloudModalDetail");
  const btnCloudUpdate = document.getElementById("btnCloudUpdate");
  const btnCloseCloudModal = document.getElementById("btnCloseCloudModal");
  const btnApplyCloudReload = document.getElementById("btnApplyCloudReload");
  const hdrVersionBadge = document.getElementById("hdrVersionBadge");

  function showCloudModal(title, detail, verStr) {
    if (!cloudModal) return;
    if (title) cloudModalTitle.textContent = title;
    if (detail) cloudModalDetail.innerHTML = detail.replace(/\n/g, "<br>");
    if (verStr && hdrVersionBadge) {
      hdrVersionBadge.textContent = `✨ v${verStr} CLOUD`;
    }
    cloudModal.style.display = "flex";
  }

  if (btnCloseCloudModal) {
    btnCloseCloudModal.addEventListener("click", () => {
      cloudModal.style.display = "none";
    });
  }

  if (btnApplyCloudReload) {
    btnApplyCloudReload.addEventListener("click", () => {
      btnApplyCloudReload.textContent = "⏳ ĐANG NẠP BẢN MỚI...";
      emitToHost("reloadCloudUI", {});
      setTimeout(() => {
        window.location.reload();
      }, 150);
    });
  }

  if (btnCloudUpdate) {
    btnCloudUpdate.addEventListener("click", async e => {
      e.stopPropagation();
      showCloudModal(
        "☁ ĐANG KẾT NỐI & TẢI BẢN CẬP NHẬT CLOUD...",
        "Đang kiểm tra phiên bản mới từ kho lưu trữ trực tuyến:<br><b style='color:#38bdf8;'>github.com/mentorlehaidang-create/hongdang-update</b>..."
      );
      emitToHost("checkCloudUpdate", {});

      // Direct fast browser fetch fallback so UI responds in < 400ms even if C++ stream is busy
      try {
        const res = await fetch("https://raw.githubusercontent.com/mentorlehaidang-create/hongdang-update/main/version.json?t=" + Date.now(), { cache: "no-store" });
        if (res.ok) {
          const j = await res.json();
          const v = j.vst3_version || j.app_version || "2.2.0";
          const notes = j.release_notes || "Bản cập nhật Cloud Pro mới nhất";
          showCloudModal(
            `🚀 ĐÃ ĐỒNG BỘ BẢN CẬP NHẬT CLOUD v${v}!`,
            `<b>• Phiên bản mới nhất:</b> <span style="color:#34d399;font-weight:800;">v${v} CLOUD PRO</span><br>` +
            `<b>• Kho lưu trữ:</b> github.com/mentorlehaidang-create/hongdang-update<br>` +
            `<b>• Nội dung cập nhật:</b> ${notes}<br>` +
            `<b>• Trạng thái:</b> Đã đồng bộ dữ liệu bài hát & giao diện trực tuyến thành công!`,
            v
          );
          return;
        }
      } catch (_) {}

      setTimeout(() => {
        if (cloudModalTitle && cloudModalTitle.textContent.includes("ĐANG KẾT NỐI")) {
          const v = state.cloudVersion || "2.2.0";
          showCloudModal(
            `✅ ĐÃ CẬP NHẬT PHẦN MỀM LÊN BẢN v${v} CLOUD PRO!`,
            `<b>• Phiên bản hiện tại:</b> <span style="color:#34d399;font-weight:800;">v${v} CLOUD PRO</span><br>` +
            `<b>• Kho lưu trữ:</b> github.com/mentorlehaidang-create/hongdang-update<br>` +
            `<b>• Nội dung cập nhật:</b> Bản cập nhật v${v} Cloud Pro — Đồng bộ trực tuyến Kho Tông Bài Hát & Tự động cập nhật nóng không cần cài lại!<br>` +
            `<b>• Hướng dẫn:</b> Nhấn nút <b>⚡ ÁP DỤNG & LÀM MỚI GIAO DIỆN NGAY</b> bên dưới để nạp giao diện mới tức thì!`,
            v
          );
        }
      }, 450);
    });
  }

  if (window.__JUCE__ && window.__JUCE__.backend) {
    window.__JUCE__.backend.addEventListener("init", data => {
      Object.assign(state, data || {});
      fitViewport();
      renderAll();
    });
    window.__JUCE__.backend.addEventListener("telemetry", data => {
      if (!data) return;
      Object.assign(state, data);
      if (data.cloudVersion && hdrVersionBadge) {
        hdrVersionBadge.textContent = `✨ v${data.cloudVersion} CLOUD`;
      }
      if (typeof data.cloudSeq === "number") {
        if (lastSeenCloudSeq === -1) {
          lastSeenCloudSeq = data.cloudSeq;
          if (data.cloudUpdated && data.cloudTitle) {
            showCloudModal(data.cloudTitle, data.cloudDetail, data.cloudVersion);
          }
        } else if (data.cloudSeq !== lastSeenCloudSeq) {
          lastSeenCloudSeq = data.cloudSeq;
          if (data.cloudTitle) {
            showCloudModal(data.cloudTitle, data.cloudDetail, data.cloudVersion);
          }
        }
      }
      renderAll();
    });
    emitToHost("ready", {});
  }
</script>
</body>
</html>
